<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - Tableau de bord</title>
    <!-- Chargement des styles découpés -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <main class="split-layout">
        <section class="placeholder-panel">
            <div class="placeholder-box">
                <h2>Work in progress</h2>
                <p>Cette partie n'est pas encore codée.</p>
            </div>
        </section>

        <section class="dashboard-panel">
            <h1>État des corrections</h1>
            
            <div class="dashboard-top">
                <div class="class-row">
                    <h3>3e</h3>
                    <div class="class-grid" id="grid-3e"></div>
                </div>
                <div class="class-row">
                    <h3>4e</h3>
                    <div class="class-grid" id="grid-4e"></div>
                </div>
                <div class="class-row">
                    <h3>5e</h3>
                    <div class="class-grid" id="grid-5e"></div>
                </div>
                <div class="class-row">
                    <h3>6e</h3>
                    <div class="class-grid" id="grid-6e"></div>
                </div>
            </div>

            <div class="dashboard-bottom">
                <h2>Liste d'attente</h2>
                <div id="liste-attente" class="waiting-list-content">
                    <!-- Rempli par le JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Chargement des scripts découpés (l'ordre est important) -->
    <script src="data/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
