<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - Tableau de bord</title>
    <!-- Chargement des styles découpés -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <main class="split-layout">
        <!-- PARTIE GAUCHE : Analyse -->
        <section class="analysis-panel">
            <h1 class="section-title">Commentaires sur vos propositions d'écoutes</h1>
            
            <!-- Zone scrollable de gauche -->
            <div class="panel-content">
                <div class="analysis-container" id="analysis-container">
                    <p class="placeholder-text">Chargement de l'analyse...</p>
                </div>
            </div>
        </section>
        <!-- LA POIGNÉE DE REDIMENSIONNEMENT -->
        <div class="resizer" id="resizer"></div>
        <!-- PARTIE DROITE : Tableau de bord -->
        <section class="dashboard-panel">
            <h1 class="section-title">État des corrections</h1>
            
            <!-- Zone scrollable de droite -->
            <div class="panel-content">
                
                <!-- Bloc du haut : Grille des classes -->
                <div class="dashboard-top">
                    <div class="class-row">
                        <h3>3e</h3>
                        <div class="class-grid" id="grid-3e"></div>
                    </div>
                    <div class="class-row">
                        <h3>4e</h3>
                        <div class="class-grid" id="grid-4e"></div>
                    </div>
                    <div class="class-row">
                        <h3>5e</h3>
                        <div class="class-grid" id="grid-5e"></div>
                    </div>
                    <div class="class-row">
                        <h3>6e</h3>
                        <div class="class-grid" id="grid-6e"></div>
                    </div>
                </div>

                <!-- Bloc du bas : Liste d'attente -->
                <div class="dashboard-bottom">
                    <h2>Liste d'attente</h2>
                    <div id="liste-attente" class="waiting-list-content"></div>
                </div>

            </div>
        </section>
    </main>

    <!-- Chargement des scripts découpés (l'ordre est important) -->
    <script src="data/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
