<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - Tableau de bord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="split-layout">
        <!-- PARTIE GAUCHE : Tableau de bord -->
        <section class="left-panel">
            <h1>État des corrections</h1>
            
            <div class="dashboard-grid">
                <!-- Module 1 : Classes corrigées -->
                <div class="card">
                    <h2>Classes corrigées</h2>
                    <div id="classes-corrigees" class="card-content">
                        <!-- Rempli par JS -->
                        <p class="placeholder-text">En attente de données...</p>
                    </div>
                </div>

                <!-- Module 2 : Liste d'attente -->
                <div class="card">
                    <h2>Liste d'attente</h2>
                    <div id="liste-attente" class="card-content">
                        <!-- Rempli par JS -->
                        <p class="placeholder-text">En attente de données...</p>
                    </div>
                </div>

                <!-- Module 3 : Estimation -->
                <div class="card">
                    <h2>Estimation</h2>
                    <div id="estimation" class="card-content">
                        <!-- Rempli par JS -->
                        <p class="placeholder-text">En attente de données...</p>
                    </div>
                </div>

                <!-- Module 4 : Progression -->
                <div class="card">
                    <h2>Progression globale</h2>
                    <div id="progression" class="card-content">
                        <!-- Rempli par JS -->
                        <p class="placeholder-text">En attente de données...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- PARTIE DROITE : Placeholder -->
        <section class="right-panel">
            <div class="placeholder-box">
                <h2>Work in progress</h2>
                <p>Cette partie n'est pas encore codée.</p>
            </div>
        </section>
    </main>

    <!-- Chargement des scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
